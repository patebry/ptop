[package]
name = "ptop"
version = "0.1.0"
edition = "2021"
description = "Native terminal system monitor inspired by vtop"
repository = "https://github.com/patebry/ptop"
license = "MIT"

[dependencies]
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1