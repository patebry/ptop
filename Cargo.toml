[package]
name = "ptop"
version = "0.1.3"
edition = "2021"
description = "Pate's top: a copy of vtop rewritten in Rust for less overhead"
repository = "https://github.com/patebry/ptop"
license = "MIT"

[dependencies]
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
